{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="d1">
        <h1 class="t1">Создайте новую задачу</h1>
        <form class="f1" method="POST">
            {% csrf_token %}
            <input class="in1" name="title" maxlength="100" placeholder="Name" required>
            <input class="in1" name="caption" maxlength="100" placeholder="Caption" required>
            <input class="in1" name="due_date" maxlength="100" placeholder="Date формат не важен 😊" required>
            <button class="b1" type="submit">Сохранить задачу</button>
        </form>
        <a class="add1 full1" href="/show_tasks">Посмотреть мои задачи</a>
    </div>
</body>
</html>
